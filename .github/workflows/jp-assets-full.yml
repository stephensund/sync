name: JP full assets (manual cold start)

# 冷启动专用 workflow：手动触发，用于初始化或重新获取完整 AssetBundles
# 平时使用主 workflow (jp-loadingbg.yml) 做增量同步即可
on:
  workflow_dispatch:
    inputs:
      version_types:
        description: 'Version types to download (comma-separated). Blank = all 10 types.'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  full-download:
    runs-on: ubuntu-latest
    timeout-minutes: 480  # 8 hours max

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install azlassets
        run: |
          python -m pip install --upgrade pip
          pip install azlassets
          azl --help

      # Full download: no state cache, --force-refresh to get everything fresh
      - name: Download all JP assets (full, no incremental)
        run: |
          python - <<'PY'
          import sys
          import azl
          import azlassets.classes as cls
          import azlassets.updater as updater

          # Patch: VersionType __hash__ (required on some azlassets versions)
          VT = getattr(cls, "VersionType", None)
          if VT and getattr(VT, "__hash__", None) is None:
              VT.__hash__ = lambda self: hash(str(self))
              print("[patch] Patched VersionType.__hash__")

          # Patch: remove_asset / delete_asset_safe to handle directories
          import pathlib, shutil
          for attr in ('remove_asset', 'delete_asset_safe'):
              if hasattr(updater, attr):
                  orig = getattr(updater, attr)
                  def patched(f, orig):
                      def wrapper(assetpath):
                          p = pathlib.Path(assetpath.full) if hasattr(assetpath, 'full') else pathlib.Path(assetpath)
                          if p.is_dir():
                              shutil.rmtree(p)
                              print(f"[patch] Removed dir: {p}")
                          else:
                              f(assetpath)
                      return wrapper
                  setattr(updater, attr, patched(orig, orig))
                  print(f"[patch] Patched updater.{attr} for directory deletion")
                  break

          # Download all JP assets, force refresh
          sys.argv = ["azl", "download", "JP", "--force-refresh"]
          azl.main()
          print("[done] Download complete.")

          # Extract all asset bundles
          sys.argv = ["azl", "extract", "JP"]
          azl.main()
          print("[done] Extract complete.")

          # Show what was downloaded
          import os
          ab = pathlib.Path("ClientAssets/JP/AssetBundles")
          if ab.exists():
              subs = sorted(os.listdir(str(ab)))
              print(f"[info] AssetBundles subdirs ({len(subs)}):")
              for s in subs:
                  subp = ab / s
                  count = len(os.listdir(str(subp))) if subp.is_dir() else 0
                  print(f"  {s}: {count} items")
          PY

      # Report total size
      - name: Report download size
        run: |
          echo "=== ClientAssets/JP size ==="
          du -sh ClientAssets/JP/ 2>/dev/null || echo "ClientAssets/JP not found"
          echo "=== AssetBundles size ==="
          du -sh ClientAssets/JP/AssetBundles/ 2>/dev/null || echo "AssetBundles not found"
          echo "=== Per subdir ==="
          if [ -d "ClientAssets/JP/AssetBundles" ]; then
            du -sh ClientAssets/JP/AssetBundles/*/ 2>/dev/null | sort -rh | head -20
          fi

      # Collect loadingbg and gallerypic from fresh download
      - name: Collect loadingbg
        run: python scripts/collect_loadingbg.py

      - name: Collect gallerypic
        run: python scripts/collect_gallerypic.py

      - name: Show collected files
        run: |
          echo "=== loadingbg ==="
          if [ -d "current_loadingbg" ] && [ -n "$(ls -A current_loadingbg 2>/dev/null)" ]; then
            echo "$(ls current_loadingbg/ | wc -l) files"
            du -sh current_loadingbg/
          else
            echo "(empty or not found)"
          fi
          echo "=== gallerypic ==="
          if [ -d "current_gallerypic" ] && [ -n "$(ls -A current_gallerypic 2>/dev/null)" ]; then
            echo "$(ls current_gallerypic/ | wc -l) files"
            du -sh current_gallerypic/
          else
            echo "(empty or not found)"
          fi

      # No previous snapshot to diff against (cold start) — zip everything as full
      - name: Pack loadingbg full
        run: |
          if [ -d "current_loadingbg" ] && [ -n "$(ls -A current_loadingbg 2>/dev/null)" ]; then
            zip -r loadingbg_full.zip current_loadingbg
          fi

      - name: Pack gallerypic full
        run: |
          if [ -d "current_gallerypic" ] && [ -n "$(ls -A current_gallerypic 2>/dev/null)" ]; then
            zip -r gallerypic_full.zip current_gallerypic
          fi

      # Pack and publish state for use by main workflow
      - name: Pack client state
        run: |
          rm -rf state_tmp && mkdir -p state_tmp/ClientAssets
          if [ -d "ClientAssets/JP" ]; then
            cp -r ClientAssets/JP state_tmp/ClientAssets/
            rm -rf state_tmp/ClientAssets/JP/AssetBundles
          fi
          tar -cf jp-client-state.tar -C state_tmp ClientAssets
          echo "jp-client-state.tar size:"
          ls -lh jp-client-state.tar

      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: jp-loadingbg-latest
          name: JP assets (cold start)
          body: |
            Full cold-start snapshot (manual `jp-assets-full` workflow).

            This release was generated by a manual cold-start run.
            jp-client-state.tar contains the full hashes.csv for incremental sync.
            loadingbg_full.zip / gallerypic_full.zip: fresh full snapshots.
          files: |
            jp-client-state.tar
            loadingbg_full.zip
            gallerypic_full.zip

