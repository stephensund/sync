name: JP loadingbg sync (state-cache, azl v4)

permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install azlassets
        run: |
          python -m pip install --upgrade pip
          pip install azlassets
          azl --help

      # Restore azlassets state cache from previous release
      - name: Restore azlassets state cache (if exists)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          API="https://api.github.com/repos/${{ github.repository }}/releases/tags/jp-loadingbg-latest"
          if curl -fsSL -H "Authorization: token $GITHUB_TOKEN" "$API" > release.json; then
            STATE_URL=$(jq -r '.assets[] | select(.name=="jp-client-state.tar") | .browser_download_url' release.json)
            if [ -n "$STATE_URL" ] && [ "$STATE_URL" != "null" ]; then
              echo "Restoring azlassets state cache..."
              curl -L -o jp-client-state.tar "$STATE_URL"
              tar -xf jp-client-state.tar
            else
              echo "No state cache found, cold-ish start."
            fi
          fi

      - name: Download JP assets (azl v4.0.0 with runtime patch)
        run: |
          python - <<'PY'
          import sys
          import azl
          import azlassets.classes as cls
          import azlassets.updater as updater

          # Patch 1: VersionType hash (原有)
          VT = getattr(cls, "VersionType", None)
          if VT is None:
              print("[patch] VersionType not found in azlassets.classes; continuing anyway.")
          else:
              if getattr(VT, "__hash__", None) is None:
                  VT.__hash__ = lambda self: hash(str(self))
                  print("[patch] Patched VersionType.__hash__ to hash(str(self))")
              else:
                  print("[patch] VersionType.__hash__ already present:", VT.__hash__)

          # Patch 2: delete_asset_safe / remove_asset 支持目录删除（修复 IsADirectoryError）
          import pathlib
          if hasattr(updater, 'remove_asset'):
              _orig_func = updater.remove_asset
              _func_name = 'remove_asset'
          elif hasattr(updater, 'delete_asset_safe'):
              _orig_func = updater.delete_asset_safe
              _func_name = 'delete_asset_safe'
          else:
              _orig_func = None
              _func_name = None

          if _orig_func is not None:
              def _patched_func(assetpath):
                  if isinstance(assetpath, pathlib.Path):
                      p = assetpath
                  else:
                      p = pathlib.Path(assetpath.full)
                  if p.is_dir():
                      import shutil
                      shutil.rmtree(p)
                      print(f"[patch] Removed directory: {p}")
                  else:
                      _orig_func(assetpath)

              if _func_name == 'remove_asset':
                  updater.remove_asset = _patched_func
              else:
                  updater.delete_asset_safe = _patched_func
              print(f"[patch] Patched updater.{_func_name} to handle directories")
          else:
              print("[patch] No remove_asset or delete_asset_safe found, skipping directory patch")

          # 让 azl 按 CLI 方式运行 download JP
          sys.argv = ["azl", "download", "JP", "--force-refresh"]
          azl.main()
          PY

      # Restore previous full snapshot for diff comparison
      - name: Restore last loadingbg snapshot (if exists)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          API="https://api.github.com/repos/${{ github.repository }}/releases/tags/jp-loadingbg-latest"
          if curl -fsSL -H "Authorization: token $GITHUB_TOKEN" "$API" > release.json; then
            FULL_URL=$(jq -r '.assets[] | select(.name=="loadingbg_full.zip") | .browser_download_url' release.json)
            if [ -n "$FULL_URL" ] && [ "$FULL_URL" != "null" ]; then
              curl -L -o loadingbg_full.zip "$FULL_URL"
              unzip -q loadingbg_full.zip
              if [ -d "last_loadingbg" ]; then
                rm -rf last_loadingbg
              fi
              mv current_loadingbg last_loadingbg
            fi
          fi

      - name: Restore last gallerypic snapshot (if exists)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          API="https://api.github.com/repos/${{ github.repository }}/releases/tags/jp-loadingbg-latest"
          if curl -fsSL -H "Authorization: token $GITHUB_TOKEN" "$API" > release.json; then
            FULL_URL=$(jq -r '.assets[] | select(.name=="gallerypic_full.zip") | .browser_download_url' release.json)
            if [ -n "$FULL_URL" ] && [ "$FULL_URL" != "null" ]; then
              curl -L -o gallerypic_full.zip "$FULL_URL"
              unzip -q gallerypic_full.zip
              if [ -d "last_gallerypic" ]; then
                rm -rf last_gallerypic
              fi
              mv current_gallerypic last_gallerypic
            fi
          fi

      # Collect current JP loadingbg files
      - name: Collect loadingbg
        run: |
          python scripts/collect_loadingbg.py

      # Collect current JP gallerypic files
      - name: Collect gallerypic
        run: |
          python scripts/collect_gallerypic.py

      # Diff current vs previous, generate zip archives
      - name: Diff and zip loadingbg
        run: |
          bash scripts/diff_and_zip.sh

      - name: Diff and zip gallerypic
        run: |
          bash scripts/diff_and_zip_gallerypic.sh

      - name: Read diff status
        id: diffcheck
        run: |
          echo "has_diff=$(cat has_diff.flag)" >> $GITHUB_OUTPUT
          echo "has_diff_gallerypic=$(cat has_diff_gallerypic.flag)" >> $GITHUB_OUTPUT

      - name: Generate meta info
        run: |
          echo "client=JP" > meta.txt
          echo "generated_at=$(date -u)" >> meta.txt
          echo "has_diff=${{ steps.diffcheck.outputs.has_diff }}" >> meta.txt
          echo "has_diff_gallerypic=${{ steps.diffcheck.outputs.has_diff_gallerypic }}" >> meta.txt

      # Pack azlassets logical state (excluding AssetBundles) for next run
      - name: Pack azlassets client state
        run: |
          rm -rf state_tmp
          mkdir -p state_tmp/ClientAssets
          # 仅当 ClientAssets/JP 存在时才打包(防首次/异常)
          if [ -d "ClientAssets/JP" ]; then
            cp -r ClientAssets/JP state_tmp/ClientAssets/
            rm -rf state_tmp/ClientAssets/JP/AssetBundles || true
          fi
          tar -cf jp-client-state.tar -C state_tmp ClientAssets

      # Publish GitHub Release with all artifacts
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: jp-loadingbg-latest
          name: JP assets latest
          body: |
            JP assets sync (azlassets v4, state-cache).

            - jp-client-state.tar : azlassets logical state (safe cache)
            - loadingbg_full.zip : latest full snapshot
            - gallerypic_full.zip : latest full snapshot
          files: |
            jp-client-state.tar
            loadingbg_full.zip
            meta.txt

      - name: Upload gallerypic full
        run: |
          if [ -s "gallerypic_full.zip" ]; then
            curl -sL -X POST \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@gallerypic_full.zip" \
              "https://uploads.github.com/repos/${{ github.repository }}/releases/tags/jp-loadingbg-latest/assets?name=gallerypic_full.zip"
          fi
        shell: bash

      - name: Upload loadingbg diff
        uses: softprops/action-gh-release@v2
        with:
          tag_name: jp-loadingbg-latest
          files: loadingbg_diff.zip
        if: steps.diffcheck.outputs.has_diff == 'true'

      - name: Upload gallerypic diff
        uses: softprops/action-gh-release@v2
        with:
          tag_name: jp-loadingbg-latest
          files: gallerypic_diff.zip
        if: steps.diffcheck.outputs.has_diff_gallerypic == 'true'
